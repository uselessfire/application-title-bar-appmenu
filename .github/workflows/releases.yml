name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  plasmoid:
    name: Plasmoid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          version=$(jq -r .KPlugin.Version package/metadata.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package/metadata.json has version $version, the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # Without the compiled module the widget works, just without the application menu.
      - name: Pack the plasmoid
        run: |
          mkdir dist
          cd package
          zip -r "../dist/application-title-bar-appmenu-${GITHUB_REF_NAME#v}.plasmoid" .

      - uses: actions/upload-artifact@v7
        with:
          name: plasmoid
          path: dist/
          if-no-files-found: error

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare the build environment
        run: |
          pacman -Syu --noconfirm --needed namcap pacman-contrib
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder

      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          if [ "v$pkgver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The PKGBUILD has version $pkgver, the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # The PKGBUILD downloads the sources of the tag, like any user of it would.
      - name: Build the package
        run: |
          install -d -o builder work dist
          cp packaging/arch/PKGBUILD packaging/arch/*.install work/
          chown builder work/*
          cd work
          sudo -u builder updpkgsums
          sudo -u builder makepkg --syncdeps --noconfirm
          rm -f ./*-debug-*.pkg.tar.zst
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst
          cp ./*.pkg.tar.zst PKGBUILD ./*.install ../dist/

      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs:
      - plasmoid
      - arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Installation

            **Arch Linux:** install the package, it contains the widget and the compiled application menu module:
            `sudo pacman -U plasma6-applets-application-title-bar-appmenu-*-x86_64.pkg.tar.zst`
            The `PKGBUILD` of this release builds the same package from the sources.

            **Other distributions:** build the widget with its module from the sources, see [Installation](https://github.com/${{ github.repository }}#installation).
            The `.plasmoid` file alone installs the widget without the application menu.

            Restart Plasma after an upgrade: `systemctl --user restart plasma-plasmashell.service`
